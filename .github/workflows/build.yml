name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # 升级 Xcode 时只改这里；可用版本见 actions/runner-images 的 macos-26 README
      XCODE_APP: /Applications/Xcode_26.6.app
      XCODEGEN_VERSION: 2.45.4

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Core tests
        run: scripts/test-core.sh

      - name: Generate Xcode project
        run: |
          curl -sSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project Sepia.xcodeproj \
            -scheme Sepia \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            SEPIA_COMMIT=${GITHUB_SHA::7}

      - name: Ad-hoc sign and package IPA
        id: ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/Sepia.app
          # TrollStore 原样保留二进制自带的 entitlements，完全不签名就没有 application-identifier，
          # 系统文件选择器点「打开」会无反应。其他自签工具会用自己的签名覆盖这一步
          codesign --force --sign - --entitlements ci/Sepia.entitlements --timestamp=none "$APP"
          codesign -dv "$APP" 2>&1 | grep -E '^(Identifier|Signature)='
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | plutil -p -
          /usr/libexec/PlistBuddy -c Print "$APP/Info.plist" \
            | grep -E 'CFBundle(Identifier|ShortVersionString|Version) |MinimumOSVersion|SepiaCommit'
          mkdir -p Payload
          cp -R "$APP" Payload/
          NAME="Sepia-${{ github.run_number }}-${GITHUB_SHA::7}.ipa"
          zip -qry "$NAME" Payload
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.ipa.outputs.name }}
          archive: false
          retention-days: 30
