name: Sepia

options:
  bundleIdPrefix: com.zcp
  # 系统控件（左滑删除、编辑按钮、文件选择器）显示中文
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.2.0"
    # CI 用运行序号和 commit 覆盖这两个值
    CURRENT_PROJECT_VERSION: "1"
    SEPIA_COMMIT: dev
    SWIFT_VERSION: "5.0"

targets:
  Sepia:
    type: application
    platform: iOS
    sources:
      - Sepia
    info:
      path: Sepia/Info.plist
      properties:
        CFBundleDisplayName: Sepia
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SepiaCommit: $(SEPIA_COMMIT)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 锁屏后继续播放
        UIBackgroundModes:
          - audio
        # 让 Documents（日志）出现在「文件」App → 我的 iPhone
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zcp.sepia
        TARGETED_DEVICE_FAMILY: "1"
        # 系统控件（文件选择器、弹窗按钮、开关）的主题色，值同 Theme.accent
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme: {}
